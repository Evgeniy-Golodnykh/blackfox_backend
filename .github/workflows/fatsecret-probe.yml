name: fatsecret activity probe

# One-off check: does FatSecret's exercise diary hold the user's activity
# (synced from a watch / Apple Health)? Started by a tag
#   probe-fatsecret-<username>-<n>
# The summary goes to that user's own Telegram chat with the bot — this
# repo's logs are public, so the log only says whether it was sent.

on:
  push:
    tags:
      - 'probe-fatsecret-*'

concurrency:
  group: production-server
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - name: probe over ssh
      uses: appleboy/ssh-action@v1.2.0
      env:
        TAG: ${{ github.ref_name }}
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_SSH_PORT }}
        envs: TAG
        script: |
          set -e
          PROBE_USER=$(echo "$TAG" | sed -E 's/^probe-fatsecret-//; s/-[0-9]+$//')
          sudo docker compose exec -T -e PROBE_USER="$PROBE_USER" backend python manage.py shell <<'PY'
          import datetime as dt, os
          from collections import defaultdict
          from django.contrib.auth import get_user_model
          from fatsecret.tools import BASE_URL, fatsecret, unix_date_converter
          from tgbot.models import TelegramAccount
          from tgbot.telegram_api import send_message

          user = get_user_model().objects.get(username=os.environ['PROBE_USER'])
          account = TelegramAccount.objects.filter(user=user).first()
          if not account:
              print('probe: user has no linked Telegram — nothing sent')
              raise SystemExit
          session = fatsecret.get_session(token=(user.fatsecret_token, user.fatsecret_secret))

          def call(method, day):
              data = session.get(BASE_URL, params={'method': method, 'format': 'json',
                                                   'date': unix_date_converter(day)}).json()
              if data.get('error'):
                  raise RuntimeError(f"{method}: error {data['error'].get('code')}")
              return data

          def as_list(value):
              return value if isinstance(value, list) else ([value] if value else [])

          today = dt.date.today()
          lines = ['🔎 FatSecret: что есть в дневнике активности', '']
          try:
              days = []
              for month_day in (today, today.replace(day=1) - dt.timedelta(days=1)):
                  month = call('exercise_entries.get_month.v2', month_day).get('month') or {}
                  days += as_list(month.get('day'))
              burned = {unix_date_converter(int(d['date_int'])): float(d['calories']) for d in days}
              recent = sorted(d for d in burned if d > today - dt.timedelta(days=30))
              lines.append(f'Дней с сожжёнными калориями за 30 дней: {len(recent)}')
              for d in recent[-7:]:
                  lines.append(f'  {d:%d.%m}: {burned[d]:.0f} ккал')

              kinds = defaultdict(lambda: [0, 0, 0.0, 0])
              for back in range(7):
                  day = today - dt.timedelta(days=back)
                  entries = (call('exercise_entries.get.v2', day).get('exercise_entries') or {})
                  for e in as_list(entries.get('exercise_entry')):
                      k = kinds[e.get('exercise_name', '?')]
                      k[0] += 1
                      k[1] += int(float(e.get('minutes') or 0))
                      k[2] += float(e.get('calories') or 0)
                      k[3] += 1 if str(e.get('is_template_value')) == '1' else 0
              lines += ['', 'Занятия за 7 дней (раз · минут · ккал · из них шаблон):']
              for name, (n, minutes, kcal, tpl) in sorted(kinds.items(), key=lambda x: -x[1][2]):
                  lines.append(f'  {name}: {n} · {minutes} · {kcal:.0f} · {tpl}')
              if not kinds:
                  lines.append('  пусто')
          except Exception as err:
              lines.append(f'Ошибка: {type(err).__name__}: {str(err)[:120]}')
          finally:
              session.close()

          result = send_message(account.telegram_id, '\n'.join(lines))
          print(f'probe: summary {result} to the user\'s Telegram')
          PY
