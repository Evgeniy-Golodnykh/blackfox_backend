# /etc/nginx/conf.d/default.conf on the server (applied with a
# nginx-apply-* tag, see .github/workflows/nginx-apply.yml).
# Started from the server's own config (nginx -T, November 2026), adding:
#   - gzip for text, JSON, fonts and wasm;
#   - a year of caching for the app's hashed files (/_expo/static/, /assets/),
#     no caching for index.html, so a deploy is picked up at once.

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
# .ttf has no MIME type in the stock mime.types: it goes out as
# application/octet-stream, hence that type here (images are typed and
# already compressed, so they aren't affected).
gzip_types text/plain text/css text/xml application/javascript application/json
           application/manifest+json image/svg+xml application/wasm
           application/octet-stream font/ttf font/otf;


# ============================================================
# WWW.BLACKFOXNUTRITION.RU
# HTTP -> HTTPS
# ============================================================

server {
    listen 80;
    server_name www.blackfoxnutrition.ru;

    location /.well-known/acme-challenge/ {
        alias /var/www/html/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# WWW.BLACKFOXNUTRITION.RU
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    server_name www.blackfoxnutrition.ru;

    ssl_certificate /etc/letsencrypt/live/www.blackfoxnutrition.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.blackfoxnutrition.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --------------------------------------------------------
    # Static
    # --------------------------------------------------------

    location /static/ {
        alias /var/html/static/;
    }

    # --------------------------------------------------------
    # Media
    # --------------------------------------------------------

    location /media/ {
        alias /var/html/media/;
    }

    # --------------------------------------------------------
    # Django Admin
    # --------------------------------------------------------

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend:8000/admin/;
    }

    # --------------------------------------------------------
    # API
    # --------------------------------------------------------

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend:8000/api/;
    }

    # --------------------------------------------------------
    # Frontend
    # --------------------------------------------------------

    # Files with a content hash in their name (JS bundle, fonts, images):
    # a new version gets a new name, so they can be cached for a year.
    location ~ ^/(_expo/static|assets)/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /index.html;
        # index.html (and every app route served by it) is checked every
        # time, so a new deploy reaches people without clearing caches.
        add_header Cache-Control "no-cache";
    }
}
